# Default values for agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# ⚠️  Do NOT put real credentials here — this file is committed to version control.
#     Copy .values.yaml.example to .values.yaml and fill in your actual values.
#     .values.yaml is gitignored and loaded with: helm upgrade --install ... -f .values.yaml

replicaCount: 1

image:
  repository: ghcr.io/kaja-labs/kaja-agent
  # IfNotPresent is correct for the production model: the chart pins an immutable
  # semver tag (appVersion, e.g. v0.1.0) so there's nothing to re-pull for a given
  # version, and rollout happens by moving to a new tag (helm upgrade, or the
  # in-console one-click update in docs/agent-rollout PHASE-3).
  # For LOCAL DEV against a mutable tag (e.g. develop), override in your
  # gitignored .values.yaml with: image: { tag: develop, pullPolicy: Always }.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# RBAC configuration
rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

# Environment variables for the agent
env:
  # Agent authentication token — required, obtain from the Kaja console.
  # The platform resolves the cluster identity from this token at login,
  # so no cluster name/id needs to be configured here.
  agentToken: ""
  # agentId: optional override that scopes resource names/namespaces. Set only
  # when running multiple agents on the same Kubernetes cluster.
  agentId: ""
  # gRPC server URL of the Kaja platform
  portServerUrl: "grpc.server.kaja.dev:443"
  # Use TLS for gRPC (recommended for production; set false for local dev / NodePort)
  grpcUseTls: true
  logLevel: "info"
  # Automatic HTTPS. When true, the agent creates a Let's Encrypt PRODUCTION ClusterIssuer
  # using the cert-manager that the agent already requires (for its admission webhook), so
  # routes get trusted certificates with no manual TLS secrets. Requires an ingress
  # controller to already be present in the cluster.
  autoHttps: false
  # Contact email for the Let's Encrypt account. Required when autoHttps is true.
  acmeEmail: ""
  # ACME directory the managed ClusterIssuer points at. Empty means Let's Encrypt production.
  #
  # Set this to staging before exercising a NEW issuance path for the first time:
  #   https://acme-staging-v02.api.letsencrypt.org/directory
  # Production counts failed orders against a per-registered-domain limit, and every generated
  # Kaja hostname shares one registered domain — so a broken first attempt does not spend your
  # budget, it spends everybody's. Staging speaks the same protocol with far looser limits.
  #
  # Staging certificates are NOT publicly trusted; browsers will warn. To go back, clear this and
  # delete the certificate's TLS secret so cert-manager re-issues against production.
  acmeServer: ""
  # Self-hosted gateway (docs/self-hosted-gateway) agent-plane address. Empty
  # disables the gateway tunnel component entirely, leaving the private cluster
  # unreachable — the gateway is the only inbound path (the Cloudflare tunnel
  # has been removed). Defaults to this deployment's gateway; override
  # per-install if you're running your own gateway elsewhere.
  # The record is DNS-only (unproxied) and :7000 is reachable — verified
  # 2026-08-19. An earlier note here claimed the opposite; it is no longer true.
  # Don't fall back to a raw IP even temporarily; fix DNS instead, since IPs on
  # this node can change.
  gatewayEndpoint: "gateway.kaja.dev:7000"
  # Skip verifying the gateway's cert on the agent-plane TLS handshake.
  #
  # Leave this false. The token this channel carries is the agent's only
  # identity and grants cluster-admin on your cluster, so an unverified channel
  # hands it to anyone able to sit on the path or hijack DNS.
  #
  # It was unavoidable until 2026-08-19, when gateway.kaja.dev:7000 still
  # presented a self-signed cert and no agent could have connected otherwise.
  # It now serves a publicly trusted cert. Set this true only for a self-hosted
  # gateway behind a private CA.
  # See docs/gateway-security/PHASE-0-agent-identity.md.
  gatewayTLSInsecureSkipVerify: false

# Webhook configuration
webhook:
  enabled: true
  # Run only the webhook server without controllers.
  webhookOnly: false
  # Webhook server port (must be unique per agent if multiple agents share a cluster)
  port: 9443
  # Health probe bind address (must be unique per agent if co-located)
  healthProbeAddr: ":8081"
  certPath: "/tmp/k8s-webhook-server/serving-certs"
  certName: "tls.crt"
  certKey: "tls.key"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Declared rather than left empty, which is what this used to be. With no requests the agent is
# BestEffort QoS — the first thing the kubelet evicts under node pressure — and the agent is the
# one workload whose death disconnects the whole cluster from the control plane. An unbounded
# build job on the same node was enough to do it.
#
# Sized from measurement, not guesswork: the agent idles at ~3m CPU / 43Mi on a cluster of ~150
# objects (see docs/cluster-resources). CPU is generous against its real usage because the agent
# is I/O bound on watches and only spikes on reconnect storms and resyncs, where being throttled
# is what turns a blip into a backlog.
#
# Memory is the one to raise on a large cluster. The manager's informer cache is cluster-wide and
# unfiltered, so agent memory tracks total objects in the cluster rather than Kaja's own
# footprint: budget 256Mi/1Gi past ~500 objects and 512Mi/2Gi past ~5,000.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
