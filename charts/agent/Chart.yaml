apiVersion: v2
name: kaja-agent-chart
description: >
  Kaja Agent — deployed into each managed cluster. Runs Kubernetes controllers
  and webhooks, syncs resource state to the Kaja platform, and executes
  commands received via gRPC long-polling.
type: application

# Versions follow Semantic Versioning (https://semver.org/)
# version   = the chart's own version (bump on any chart change).
# appVersion = the agent image tag this chart installs by default. It MUST be an
#   immutable, published agent image tag (e.g. v0.1.0) — releases publish the
#   image first, then bump this. Kept in lockstep with constants.RecommendedAgentVersion
#   on the platform side. See docs/agent-rollout/RELEASE.md.
version: 0.3.3
appVersion: "v0.2.1"

home: https://github.com/abdheshnayak/kaja
sources:
  - https://github.com/abdheshnayak/kaja

keywords:
  - kaja
  - kaja-agent
  - kubernetes
  - agent
  - operator
  - multi-cluster
  - controller

maintainers:
  - name: abdheshnayak
    url: https://github.com/abdheshnayak
