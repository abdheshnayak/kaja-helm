apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kaja-rabbitmq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaja-rabbitmq.labels" . | nindent 4 }}
# The broker never talks to the Kubernetes API. Peer discovery would need it; this chart is
# single-node and does not run it.
automountServiceAccountToken: false
